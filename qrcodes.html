<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes — De Verloren Schatten van d'Artagnan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background: #f4e6be;
            color: #2a1505;
            padding: 32px 24px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #7b1818;
            margin-bottom: 8px;
        }

        .qr-logo {
            height: 80px;
            width: auto;
            display: block;
            margin: 0 auto 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #3d1f0a;
            margin-bottom: 32px;
            font-style: italic;
        }

        .btn-print {
            display: block;
            margin: 0 auto 32px;
            padding: 12px 32px;
            background: #7b1818;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.05em;
        }

        .btn-print:hover { background: #9e2020; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: #fffdf5;
            border: 3px solid #c8a84b;
            border-radius: 10px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(61,31,10,0.2);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .card-number {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7b1818;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: #7b1818;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .card-location {
            font-size: 0.85rem;
            color: #3d1f0a;
            margin-bottom: 16px;
            font-style: italic;
        }

        .qr-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        .qr-wrap canvas,
        .qr-wrap img {
            border: 2px solid #c8a84b;
            border-radius: 6px;
            padding: 8px;
            background: #fff;
        }

        .card-value {
            font-size: 0.72rem;
            color: #8a7050;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .card-letter {
            display: inline-block;
            background: #7b1818;
            color: #d4af37;
            font-size: 1.6rem;
            font-weight: bold;
            width: 48px;
            height: 48px;
            line-height: 48px;
            border-radius: 6px;
            border: 2px solid #d4af37;
        }

        /* Print styles */
        @media print {
            body { background: #fff; padding: 16px; }
            .btn-print { display: none; }
            .subtitle { margin-bottom: 20px; }
            .grid { gap: 16px; }
            .card { box-shadow: none; border: 2px solid #999; }
            .card-value { color: #555; }
        }
    </style>
</head>
<body>

    <img src="logo.png" class="qr-logo" alt="De Verloren Schatten van d'Artagnan">
    <h1>QR Codes — De Verloren Schatten van d'Artagnan</h1>
    <p class="subtitle">Print deze pagina en hang de kaarten op bij de vijf locaties.</p>

    <button class="btn-print" onclick="window.print()">🖨️ Afdrukken</button>

    <div class="grid" id="grid"></div>

    <!-- QR code library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const CONFIG_KEY = 'artagnan_config_v1';

        const DEFAULT_LOCATIONS = [
            { number: 1, title: 'De Wijsheid van Athos',        location: 'Athos Eet-Maakt-Doet',        value: 'DARTAGNAN-ATHOS-2026-A',        letter: 'A' },
            { number: 2, title: "Het Schild van d'Artagnan",    location: 'Zorgcentrum Campagne',         value: 'DARTAGNAN-CAMPAGNE-2026-L',      letter: 'L' },
            { number: 3, title: 'De Bescherming van Aramis',    location: 'Petrus en Pauluskerk Wolder',  value: 'DARTAGNAN-WOLDER-KERK-2026-L',   letter: 'L' },
            { number: 4, title: 'De Brief van de Koning',       location: 'Apostelhoeve',                 value: 'DARTAGNAN-APOSTELHOEVE-2026-E',  letter: 'E' },
            { number: 5, title: 'De Gastvrijheid van Porthos',  location: 'Restaurant Prix de Rome',      value: 'DARTAGNAN-PRIXDEROME-2026-N',    letter: 'N' }
        ];

        function getLocations() {
            try {
                const raw = localStorage.getItem(CONFIG_KEY);
                if (raw) {
                    const cfg = JSON.parse(raw);
                    if (cfg && Array.isArray(cfg.locations) && cfg.locations.length === 5) {
                        return cfg.locations.map((loc, i) => ({
                            number:   i + 1,
                            title:    loc.title,
                            location: loc.name,
                            value:    loc.qrValue,
                            letter:   loc.letter
                        }));
                    }
                }
            } catch (_) {}
            return DEFAULT_LOCATIONS;
        }

        const locations = getLocations();

        const grid = document.getElementById('grid');

        locations.forEach(loc => {
            // Card
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML =
                '<div class="card-number">Locatie ' + loc.number + ' van 5</div>' +
                '<div class="card-title">' + loc.title + '</div>' +
                '<div class="card-location">' + loc.location + '</div>' +
                '<div class="qr-wrap" id="qr-' + loc.number + '"></div>' +
                '<div class="card-value">' + loc.value + '</div>' +
                '<div class="card-letter">' + loc.letter + '</div>';

            grid.appendChild(card);

            // Generate QR code into the placeholder div
            new QRCode(document.getElementById('qr-' + loc.number), {
                text:          loc.value,
                width:         180,
                height:        180,
                colorDark:     '#2a1505',
                colorLight:    '#ffffff',
                correctLevel:  QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
