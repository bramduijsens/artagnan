<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Full bleed background for maskable icon (safe zone = centre 80%) -->
  <rect width="192" height="192" fill="#7b1818"/>

  <!-- Shield body — slightly smaller to stay in safe zone -->
  <path d="M96 30 L150 54 L150 106 C150 142 96 166 96 166 C96 166 42 142 42 106 L42 54 Z"
        fill="#d4af37"/>

  <!-- Shield inner -->
  <path d="M96 44 L140 64 L140 106 C140 132 96 152 96 152 C96 152 52 132 52 106 L52 64 Z"
        fill="#7b1818"/>

  <!-- Sword blade -->
  <rect x="93" y="54" width="6" height="68" rx="2" fill="#d4af37"/>

  <!-- Sword tip -->
  <polygon points="96,46 92,60 100,60" fill="#f4e6be"/>

  <!-- Crossguard -->
  <rect x="78" y="88" width="36" height="7" rx="3" fill="#d4af37"/>

  <!-- Pommel -->
  <circle cx="96" cy="128" r="6" fill="#d4af37"/>
  <circle cx="96" cy="128" r="2.5" fill="#f4e6be"/>
</svg>
